name: Hugo Build and FTP Deploy
on:
  push:
    branches:
      - main
jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0
      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v2
        with:
          hugo-version: '0.123.0'
          extended: true
      - name: Build
        run: hugo --minify
      - name: FTP Deploy
        uses: SamKirkland/web-deploy@v1
        with:
          target-server: ${{ secrets.FTP_SERVER }}
          remote-user: ${{ secrets.FTP_USERNAME }}
          private-ssh-key: ${{ secrets.FTP_PASSWORD }}
          source-path: ./public/
          destination-path: ./blog/
          protocol: ftp
          
