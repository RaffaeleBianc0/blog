baseURL = 'https://www.RaffaeleBianco.it/blog/'
languageCode = 'it-it'
title = 'Mica scrivo granché'
theme = 'hugo-theme-stack'
enableEmoji = true

pagination.pagerSize = 10
copyright = "Raffaele Bianco"
DefaultContentLanguage = "it"
hasCJKLanguage = false

[languages.it]
languageName = "Italiano"
title = "Mica scrivo granché"
weight = 1
params.sidebar.subtitle = "Blog di Raffaele Bianco."

# [languages.en]
# languageName = "English"
# title = "Raffaele Bianco's Blog"
# weight = 2

#   [languages.en.params]
#   description = ""

[permalinks]
post = "/p/:slug/"
page = "/:slug/"

[params]
mainSections = [ "post" ]
featuredImageField = "image"
rssFullContent = true
favicon = "/favicon-96x96.png" # e.g.: favicon placed in `static/favicon.ico` of your site folder, then set this field to `/favicon.ico` (`/` is necessary)

  [params.footer]
  since = 2_004
  customText = ""

  [params.dateFormat]
  published = "02/01/2006"
  lastUpdated = "02/01/2006"  # Con l'ora: "02/01/2006 15:04 MST"

  [params.sidebar]
  emoji = ""  # Emoji displayed above the avatar.
  subtitle = ""
  compact = true

    [params.sidebar.avatar]
    enabled = true
    local = true  # If true, the avatar image should be placed at assets/${avatar.src}, this allows theme to automatically resize the image.
    src = "img/avatar.png"

  [params.article]
  math = false
  toc = true
  readingTime = true

    [params.article.license]
    enabled = true
    default = "Licensed under CC BY-NC-SA 4.0"

  [params.comments]
  enabled = false
  provider = "cusdis"

    [params.comments.disqusjs]
    shortname = []
    apiUrl = []
    apiKey = []
    admin = []
    adminLabel = []
    
    [params.comments.utterances]
    issueTerm = "pathname"

    [params.comments.remark42]

    [params.comments.vssue]
    autoCreateIssue = false

    [params.comments.waline]
    emoji = [ "https://unpkg.com/@waline/emojis@1.0.1/weibo" ]
    requiredMeta = [ "name", "email", "url" ]

      [params.comments.waline.locale]
      admin = "Admin"

    [params.comments.twikoo]

    [params.comments.cactus]
    defaultHomeserverUrl = "https://matrix.cactus.chat:8448"
    serverName = "cactus.chat"
    siteName = ""

    [params.comments.giscus]
    reactionsEnabled = 1
    emitMetadata = 0

    [params.comments.gitalk]

    [params.comments.cusdis]
    id = "131e48ee-ab16-4076-a340-394cf7c60e9e"

[[params.widgets.homepage]]
type = "search"

[[params.widgets.homepage]]
type = "categories"

  [params.widgets.homepage.params]
  limit = 10

[[params.widgets.homepage]]
type = "archives"

  [params.widgets.homepage.params]
  limit = 4

# [[params.widgets.homepage]]
# type = "tag-cloud"

#   [params.widgets.homepage.params]
#   limit = 10

[[params.widgets.page]]
type = "toc"

[params.opengraph.twitter]
site = "" # Your Twitter username
card = "summary_large_image" # Available values: summary, summary_large_image

[params.defaultImage.opengraph]
enabled = false
local = false
src = ""

[params.colorScheme]
toggle = true
default = "auto" # Available values: auto, light, dark

[params.imageProcessing]
cover.enabled = true
content.enabled = true



