baseURL = 'https://www.RaffaeleBianco.it/blog/'
Language.Locale = 'it-it'
title = 'Mica scrivo granché'
theme = 'hugo-theme-stack'
enableEmoji = true

pagination.pagerSize = 10
copyright = "Raffaele Bianco"
DefaultContentLanguage = "it"
hasCJKLanguage = false

[languages.it]
label = "Italiano"
title = "Mica scrivo granché"
weight = 1
params.sidebar.subtitle = "Blog di Raffaele Bianco."

# [languages.en]
# languageName = "English"
# title = "Raffaele Bianco's Blog"
# weight = 2

#   [languages.en.params]
#   description = ""

[permalinks]
post = "/p/:slug/"
page = "/:slug/"

[params]
mainSections = [ "post" ]
featuredImageField = "image"
rssFullContent = true
meta.favicon = false
favicon = "img/favicon.ico" # sotto la cartella /assets

  [params.footer]
  since = 2_004
  customText = ""

  [params.dateFormat]
  published = "02/01/2006"
  lastUpdated = "02/01/2006"  # Con l'ora: "02/01/2006 15:04 MST"

  [params.sidebar]
  emoji = ""  # Emoji displayed above the avatar.
  subtitle = ""
  compact = true

    [params.sidebar.avatar]
    enabled = true
    local = true  # If true, the avatar image should be placed at assets/${avatar.src}, this allows theme to automatically resize the image.
    src = "img/avatar.png"

  [params.article]
  math = false
  toc = true
  readingTime = true

    [params.article.license]
    enabled = true
    # default = "Licensed under CC BY-NC-SA 4.0"
    default = 'Licensed under <a href="https://creativecommons.org/licenses/by-nc-sa/4.0/">CC BY-NC-SA 4.0</a> <img src="https://mirrors.creativecommons.org/presskit/icons/cc.svg" alt="" style="max-width: 1em;max-height:1em;margin-left: .2em;"><img src="https://mirrors.creativecommons.org/presskit/icons/by.svg" alt="" style="max-width: 1em;max-height:1em;margin-left: .2em;"><img src="https://mirrors.creativecommons.org/presskit/icons/nc.svg" alt="" style="max-width: 1em;max-height:1em;margin-left: .2em;"><img src="https://mirrors.creativecommons.org/presskit/icons/sa.svg" alt="" style="max-width: 1em;max-height:1em;margin-left: .2em;">'

    [params.article.mermaid]
      version = "11"           # Mermaid version from CDN
      look = "classic"         # classic or handDrawn (sketch style)
      lightTheme = "default"   # Theme for light mode
      darkTheme = "base"       # Theme for dark mode
      securityLevel = "loose"  # strict (default), loose, antiscript, sandbox
      htmlLabels = true        # Enable HTML in labels
      maxTextSize = 50000      # Maximum text size (default: 50000)
      maxEdges = 500           # Maximum edges allowed (default: 500)
      fontSize = 16            # Global font size in pixels (default: 16)
      fontFamily = "arial"     # Global font family
      curve = "basis"          # Line curve: basis, cardinal, linear (default: basis)
      logLevel = 5             # Debug level 0-5, 0=debug, 5=fatal (default: 5)

      [params.article.mermaid.darkThemeVariables]
        primaryColor = "#1f2937"
        primaryTextColor = "#ffffff"
        lineColor = "#9ca3af"
        textColor = "#e5e7eb"

# COMMENTI
# - graphcomment.com
# - https://giscus.app/it integrato con Github
# - Ulteriori provider: https://cloudcannon.com/jamstack-ecosystem/commenting/
  [params.comments]
  enabled = true
  provider = "giscus"

    [params.comments.disqusjs]
    shortname = []
    apiUrl = []
    apiKey = []
    admin = []
    adminLabel = []
    
    [params.comments.utterances]
    issueTerm = "pathname"

    [params.comments.remark42]

    [params.comments.vssue]
    autoCreateIssue = false

    [params.comments.waline]
    emoji = [ "https://unpkg.com/@waline/emojis@1.0.1/weibo" ]
    requiredMeta = [ "name", "email", "url" ]

      [params.comments.waline.locale]
      admin = "Admin"

    [params.comments.twikoo]

    [params.comments.cactus]
    defaultHomeserverUrl = "https://matrix.cactus.chat:8448"
    serverName = "cactus.chat"
    siteName = ""

    [params.comments.giscus]
    reactionsEnabled = "1"
    emitMetadata = "0"
    repo = "RaffaeleBianc0/blog"
    repoID = "R_kgDOLMqF7Q"
    category = "Announcements"
    categoryID = "DIC_kwDOLMqF7c4DDGEa"
    mapping = "title"
    darkTheme = "noborder_dark"
    lightTheme = "noborder_light"
    inputPosition = "top"
    strict = "1"
    
    [params.comments.gitalk]

    [params.comments.cusdis]
    # id = "131e48ee-ab16-4076-a340-394cf7c60e9e"

[[params.widgets.homepage]]
type = "search"

[[params.widgets.homepage]]
type = "categories"

  [params.widgets.homepage.params]
  limit = 10

[[params.widgets.homepage]]
type = "archives"

  [params.widgets.homepage.params]
  limit = 4

# [[params.widgets.homepage]]
# type = "tag-cloud"

#   [params.widgets.homepage.params]
#   limit = 10

# [[params.widgets.homepage]]
# type = "kofi"

[[params.widgets.page]]
type = "toc"

[params.opengraph.twitter]
site = "raffaelebianco" # Your Twitter username
card = "summary_large_image" # Available values: summary, summary_large_image

[params.defaultImage.opengraph]
enabled = true
local = false
src = ""

[params.colorScheme]
toggle = true
default = "auto" # Available values: auto, light, dark

[params.imageProcessing]
cover.enabled = true
content.enabled = true



